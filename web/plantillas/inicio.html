{% extends "base.html" %}

{% block contenido %}
<h1>AulaLista</h1>

<h2>Cursos</h2>
{% if cursos %}
<ul class="lista">
  {% for c in cursos %}<li><a href="/cursos/{{ c.curso }}">{{ c.nombre }}</a></li>{% endfor %}
</ul>
{% else %}
<p>Todavía no hay cursos.</p>
{% endif %}

<form method="post" action="/cursos" class="fila">
  <label for="nombre">Nombre del curso nuevo</label>
  <input id="nombre" name="nombre" required maxlength="120">
  <button type="submit">Crear curso</button>
</form>
{% endblock %}
