<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}AulaLista{% endblock %}</title>
  <script>
    // El modo elegido con el alternador se aplica antes de pintar la página, para que no parpadee.
    try { const tema = localStorage.getItem("tema"); if (tema) document.documentElement.dataset.tema = tema; } catch (error) {}
  </script>
  <link rel="stylesheet" href="/estaticos/estilo.css?v=5">
</head>
<body>
  <main>
    <div class="cabecera">
      <nav aria-label="Ruta"><p class="ruta"><a href="/">AulaLista</a>{% block ruta %}{% endblock %}</p></nav>
      <button type="button" class="secundario tema" id="alternar-tema">Cambiar a modo oscuro</button>
    </div>
    {% if mensaje %}<p class="mensaje" role="status">{{ mensaje }}</p>{% endif %}
    {% block contenido %}{% endblock %}
  </main>
  <script>
    // Alternador de modo claro u oscuro. Sin elección guardada, sigue el modo de Windows.
    (function () {
      const boton = document.getElementById("alternar-tema");
      const oscuro = () => document.documentElement.dataset.tema
        ? document.documentElement.dataset.tema === "oscuro"
        : window.matchMedia("(prefers-color-scheme: dark)").matches;
      const pintar = () => { boton.textContent = oscuro() ? "Cambiar a modo claro" : "Cambiar a modo oscuro"; };
      boton.addEventListener("click", () => {
        const tema = oscuro() ? "claro" : "oscuro";
        document.documentElement.dataset.tema = tema;
        try { localStorage.setItem("tema", tema); } catch (error) {}
        pintar();
      });
      pintar();
    })();

    // Un formulario con data-confirmar pide confirmación antes de enviarse: por ejemplo, generar de nuevo un
    // material ya aprobado.
    document.addEventListener("submit", (evento) => {
      const mensaje = evento.target.dataset && evento.target.dataset.confirmar;
      if (mensaje && !window.confirm(mensaje)) evento.preventDefault();
    });
  </script>
  {% block scripts %}{% endblock %}
</body>
</html>
