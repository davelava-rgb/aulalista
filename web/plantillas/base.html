<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}AulaLista{% endblock %}</title>
  <link rel="stylesheet" href="/estaticos/estilo.css">
</head>
<body>
  <main>
    <p class="ruta"><a href="/">AulaLista</a>{% block ruta %}{% endblock %}</p>
    {% if mensaje %}<p class="mensaje" role="status">{{ mensaje }}</p>{% endif %}
    {% block contenido %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
