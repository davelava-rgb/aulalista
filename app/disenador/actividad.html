<!DOCTYPE html>
<!-- Página fija de la actividad web (PLAN.md §0, decisión 70). La escribe AulaLista una sola vez: en cada
     sesión se le ponen los colores y la tipografía de la ficha ({{PRINCIPAL}}, {{ACENTO}}, {{ADVERTENCIA}},
     {{FONDO}}, {{TEXTO}}, {{TIPOGRAFIA}}) y el contenido aprobado, tal cual, en el bloque de datos marcado para AulaLista.
     Sin librerías ni red, salvo las fuentes de Google; funciona sin conexión. Playwright la recorre como un
     alumno con los atributos data- (app/materiales/navegador.py). -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Actividad</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&display=swap" rel="stylesheet">
<style>
:root{
  --principal:{{PRINCIPAL}};--acento:{{ACENTO}};--advertencia:{{ADVERTENCIA}};--fondo:{{FONDO}};--texto:{{TEXTO}};
  --bg:var(--fondo);--surface:#ffffff;--ink:var(--texto);
  --muted:color-mix(in srgb,var(--texto) 72%,#ffffff);
  --line:color-mix(in srgb,var(--texto) 16%,transparent);
  --brand:var(--principal);--brand-fill:var(--principal);--on-brand:#ffffff;
  --brand-soft:color-mix(in srgb,var(--principal) 9%,var(--surface));
  --accent-ink:color-mix(in srgb,var(--acento) 68%,#000000);
  --accent-fill:var(--acento);
  --accent-soft:color-mix(in srgb,var(--acento) 14%,var(--surface));
  --warn-ink:var(--advertencia);
  --warn-soft:color-mix(in srgb,var(--advertencia) 9%,var(--surface));
  --ok-ink:var(--principal);
  --ok-soft:color-mix(in srgb,var(--principal) 10%,var(--surface));
  --band:var(--principal);--on-band:#ffffff;
  --titulos:"Fraunces",Georgia,"Times New Roman",serif;
  --cuerpo:{{TIPOGRAFIA}},Carlito,"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#121618;--surface:#1b2125;--ink:#e6eaec;--muted:color-mix(in srgb,var(--fondo) 72%,var(--texto));
    --line:rgba(230,234,236,.17);
    --brand:color-mix(in srgb,var(--principal) 40%,#ffffff);
    --brand-fill:color-mix(in srgb,var(--principal) 40%,#ffffff);
    --on-brand:#0e1214;
    --brand-soft:color-mix(in srgb,var(--principal) 32%,var(--surface));
    --accent-ink:color-mix(in srgb,var(--acento) 70%,#ffffff);
    --accent-soft:color-mix(in srgb,var(--acento) 18%,var(--surface));
    --warn-ink:color-mix(in srgb,var(--advertencia) 42%,#ffffff);
    --warn-soft:color-mix(in srgb,var(--advertencia) 22%,var(--surface));
    --ok-ink:color-mix(in srgb,var(--principal) 40%,#ffffff);
    --ok-soft:color-mix(in srgb,var(--principal) 30%,var(--surface));
    --band:color-mix(in srgb,var(--principal) 55%,#121618);
  }
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--cuerpo);font-size:17px;line-height:1.5;overflow-x:hidden}
h1,h2,h3{font-family:var(--titulos);line-height:1.15;margin:0;font-weight:700;letter-spacing:-.01em}
p{margin:0 0 .7em}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--accent-fill);outline-offset:2px}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;border:0}
.saltar{position:absolute;left:12px;top:-60px;background:var(--surface);color:var(--ink);padding:10px 14px;border-radius:8px;z-index:100}
.saltar:focus{top:12px}

/* Banda superior */
.banda{background:var(--band);color:var(--on-band);border-bottom:4px solid var(--accent-fill)}
.banda-in{max-width:1200px;margin:0 auto;padding:16px 20px 12px}
.curso{margin:0;font-size:14px;letter-spacing:.08em;text-transform:uppercase;opacity:.9}
.marca{margin:2px 0 12px;font-family:var(--titulos);font-size:20px;font-weight:600}
.barra{list-style:none;margin:0;padding:0;display:flex;gap:6px}
.barra li{flex:1 1 0;min-width:0;position:relative}
.pb{width:100%;min-height:48px;display:flex;align-items:center;gap:8px;background:transparent;border:0;color:var(--on-band);padding:6px 8px;border-radius:10px;text-align:left;cursor:pointer}
.pb .n{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid rgba(255,255,255,.7);display:grid;place-items:center;font-weight:700;font-size:15px}
.pb .t{font-size:14px;line-height:1.2;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.pb[aria-current="step"]{background:rgba(255,255,255,.14)}
.pb[aria-current="step"] .n{background:var(--acento);border-color:var(--acento);color:{{TEXTO}}}
.pb.hecho .n{background:#ffffff;border-color:#ffffff;color:{{PRINCIPAL}}}
.pb:disabled{opacity:.5;cursor:not-allowed}
.pb .est{display:block;font-size:12px;opacity:.85}

/* Estructura */
.shell{max-width:1200px;margin:0 auto;padding:28px 20px 64px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:32px;align-items:start}
main{min-width:0;outline:none}
.pantalla{animation:aparece .22s ease-out}
.pantalla[hidden]{display:none}
@keyframes aparece{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.cab-paso{display:flex;gap:16px;align-items:flex-start;margin-bottom:14px}
.numeral{font-family:var(--titulos);font-size:64px;line-height:.9;color:var(--accent-fill);font-weight:700;flex:none}
.kicker{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;margin:4px 0 4px}
.pantalla h1{font-size:clamp(32px,6vw,48px);margin-bottom:14px}
.pantalla h2{font-size:clamp(26px,4.5vw,34px)}
.pantalla h2:focus,.pantalla h1:focus{outline:none}
.intro{font-size:18px;max-width:62ch}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:0 0 18px;padding:0;list-style:none}
.chip{border:1.5px solid var(--brand);color:var(--brand);border-radius:999px;padding:4px 12px;font-weight:700;font-size:15px}
.recorrido{list-style:none;padding:0;margin:18px 0 0;border-top:1px dashed var(--line)}
.recorrido li{display:flex;gap:14px;align-items:baseline;padding:12px 0;border-bottom:1px dashed var(--line)}
.recorrido .rn{font-family:var(--titulos);color:var(--accent-ink);font-weight:700;min-width:28px}
.tarjeta{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px}
.subt{font-family:var(--titulos);font-size:20px;margin:0 0 6px}

.recuerde{display:flex;gap:12px;border-left:6px solid var(--accent-fill);background:var(--accent-soft);padding:14px 16px;border-radius:0 12px 12px 0;margin:16px 0}
.recuerde .ico{flex:none;width:28px;height:28px;border-radius:50%;background:var(--accent-fill);color:{{TEXTO}};display:grid;place-items:center;font-weight:700}
.recuerde strong{display:block;color:var(--accent-ink);font-size:14px;letter-spacing:.06em;text-transform:uppercase}
.recuerde p{margin:2px 0 0}

/* Preguntas */
.preg{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:20px;margin:22px 0;position:relative}
.preg::before{content:"";position:absolute;left:0;top:18px;bottom:18px;width:4px;border-radius:0 4px 4px 0;background:var(--brand-fill)}
.preg-cab{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:6px}
.preg-num{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.pts{background:var(--accent-soft);color:var(--accent-ink);border-radius:999px;padding:3px 12px;font-weight:700;font-size:14px;white-space:nowrap}
.enun{font-family:var(--cuerpo);font-size:19px;font-weight:700;letter-spacing:0;margin:0 0 12px;line-height:1.35}
.ctr{margin:0;border:0;padding:0;min-width:0}
.opc{display:flex;gap:12px;align-items:center;min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:12px;margin:8px 0;cursor:pointer;background:var(--surface)}
.opc input{width:22px;height:22px;margin:0;flex:none;accent-color:var(--brand-fill);cursor:pointer}
.opc:has(input:checked){border-color:var(--brand);background:var(--brand-soft)}
.opc:has(input:focus-visible){outline:3px solid var(--accent-fill);outline-offset:2px}
.opc input:focus-visible{outline:none}
.opc:has(input:disabled){cursor:default}
.orden{list-style:none;margin:0;padding:0}
.orden li{display:flex;align-items:center;gap:10px;border:1.5px solid var(--line);border-radius:12px;padding:6px 6px 6px 12px;margin:8px 0;background:var(--surface)}
.orden .pos{flex:none;width:30px;height:30px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700}
.orden .tx{flex:1;min-width:0}
.orden .mv{display:flex;gap:6px;flex:none}
.ibtn{width:44px;height:44px;border-radius:10px;border:1.5px solid var(--line);background:transparent;cursor:pointer;font-size:18px;font-weight:700;color:var(--brand)}
.ibtn:disabled{opacity:.35;cursor:not-allowed}
.fila{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.6fr);gap:10px 14px;align-items:center;padding:10px 0;border-bottom:1px dashed var(--line)}
.fila:last-child{border-bottom:0}
.fila label{font-weight:700}
select{width:100%;min-height:48px;padding:8px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:17px;cursor:pointer}
select:disabled{opacity:.8;cursor:default}
.acciones{display:flex;flex-wrap:wrap;align-items:center;gap:10px;margin-top:16px}
.intentos{color:var(--muted);font-size:15px;margin-left:auto}
.btn{min-height:44px;padding:10px 18px;border-radius:10px;font-weight:700;border:2px solid transparent;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn-p{background:var(--brand-fill);color:var(--on-brand)}
.btn-s{background:transparent;color:var(--brand);border-color:var(--brand)}
.btn-w{background:transparent;color:var(--warn-ink);border-color:var(--warn-ink)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn[hidden]{display:none}
.fb:empty{display:none}
.fb{margin-top:14px}
.res{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;font-weight:700;border-left:6px solid;outline:none;flex-wrap:wrap}
.res.correcta{background:var(--ok-soft);color:var(--ok-ink)}
.res.incorrecta{background:var(--warn-soft);color:var(--warn-ink)}
.res .nota{font-weight:400;color:var(--ink);font-size:15px;flex-basis:100%;padding-left:40px}
.ic{flex:none;width:30px;height:30px;border-radius:50%;display:grid;place-items:center;font-weight:700;color:#ffffff;font-size:16px;line-height:1}
.correcta .ic,.ic.ok{background:var(--principal)}
.incorrecta .ic,.ic.no{background:var(--advertencia)}
@media (prefers-color-scheme:dark){.correcta .ic,.ic.ok{background:var(--brand-fill);color:#0e1214}.incorrecta .ic,.ic.no{background:var(--warn-ink);color:#0e1214}}
.exps{list-style:none;padding:0;margin:10px 0 0}
.exps li{display:flex;gap:10px;padding:10px 4px;border-bottom:1px dashed var(--line)}
.exps li:last-child{border-bottom:0}
.exps .ic{width:24px;height:24px;font-size:13px;margin-top:1px}
.exps b{display:block}
.exps span.e{color:var(--muted)}
.aviso{color:var(--warn-ink);font-weight:700;margin:0}

/* Navegación */
.nav{display:flex;align-items:center;gap:12px;margin-top:28px;padding-top:18px;border-top:2px solid var(--line);flex-wrap:wrap}
.nav [data-accion="siguiente"]{margin-left:auto}
.pista{margin:0;color:var(--muted);font-size:15px;flex:1 1 180px;text-align:right}
.pista:empty{display:none}

/* Caso */
.caso{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:0 0 18px}
.caso-cab{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 18px 12px;border-bottom:3px double var(--line);background:var(--brand-soft);border-radius:16px 16px 0 0}
.caso-cab .et{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);font-weight:700;margin:0}
.caso h2{font-size:22px}
.caso-cuerpo{padding:14px 18px 0}
.cerrar{display:none}
figure{margin:18px 0 0}
figcaption{font-weight:700;margin-bottom:8px;font-family:var(--titulos);font-size:17px}
.tabla-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;max-width:100%}
table{border-collapse:collapse;width:100%;font-size:16px}
th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
thead th{background:var(--brand-soft);color:var(--brand);font-size:14px;letter-spacing:.04em;text-transform:uppercase}
tbody tr:last-child td{border-bottom:0}
td.num{text-align:right;font-variant-numeric:tabular-nums}
.grafico{width:100%;height:auto;display:block}
.grafico .grid{stroke:var(--line);stroke-width:1}
.grafico .eje{stroke:var(--muted);stroke-width:1.5}
.grafico text{fill:var(--ink);font-family:var(--cuerpo);font-size:12px}
.grafico .tick{fill:var(--muted)}
.grafico .tit-eje{font-weight:700;font-size:12.5px}
.grafico .val{font-weight:700;font-size:13px}
.grafico .s0{fill:var(--brand-fill)}
.grafico .s1{fill:var(--accent-fill)}
.leyenda{display:flex;gap:14px;flex-wrap:wrap;font-size:14px;margin-top:6px}
.leyenda i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:6px;vertical-align:-1px}
details{margin-top:10px}
summary{cursor:pointer;min-height:44px;display:flex;align-items:center;font-weight:700;color:var(--brand)}
details .tabla-wrap{margin-top:6px}
.btn-caso{display:none}
.velo{position:fixed;inset:0;background:rgba(10,14,16,.5);z-index:40;animation:velo .2s}
.velo[hidden]{display:none}
@keyframes velo{from{opacity:0}to{opacity:1}}
@keyframes entra{from{transform:translateX(100%)}to{transform:none}}

/* Entrega */
.puntaje{display:flex;align-items:center;gap:20px;flex-wrap:wrap;background:var(--brand-soft);border:1px solid var(--line);border-radius:16px;padding:20px;margin:18px 0}
.cifra{font-family:var(--titulos);font-size:60px;line-height:1;color:var(--brand);font-weight:700}
.cifra small{font-size:22px;color:var(--muted);font-weight:600}
.puntaje p{margin:0 0 4px}
.puntaje .nota-p{color:var(--muted);font-size:15px}
.campo{display:flex;flex-direction:column;gap:6px;margin:18px 0}
.campo label{font-weight:700}
.campo input{min-height:48px;padding:10px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:17px;max-width:420px;width:100%}
.resumen{list-style:none;padding:0;margin:0}
.resumen>li{border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin:10px 0;background:var(--surface)}
.resumen h3{font-size:18px;margin:0 0 6px}
.rq{padding:8px 0;border-top:1px dashed var(--line)}
.rq .q{font-weight:700;margin:0 0 4px}
.rq .a{margin:0 0 6px;overflow-wrap:anywhere}
.rq .meta{display:flex;flex-wrap:wrap;gap:8px 16px;font-size:15px;color:var(--muted);align-items:center}
.estado{display:inline-flex;align-items:center;gap:6px;font-weight:700}
.estado.correcta{color:var(--ok-ink)}
.estado.incorrecta{color:var(--warn-ink)}
.estado .ic{width:22px;height:22px;font-size:12px}
.entrega-acc{display:flex;flex-wrap:wrap;gap:12px;margin-top:20px;align-items:center}
.entrega-acc .btn-w{margin-left:auto}
#manual{width:100%;min-height:180px;margin-top:12px;padding:12px;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);font-size:15px}
#manual[hidden]{display:none}
.estado-copia{margin:10px 0 0;font-weight:700;color:var(--brand)}
.estado-copia:empty{display:none}
#app-error{padding:24px;font-weight:700}

@media (hover:hover){
  .btn-p:hover:not(:disabled){background:color-mix(in srgb,var(--brand-fill) 86%,#000000)}
  .btn-s:hover:not(:disabled){background:var(--brand-soft)}
  .btn-w:hover:not(:disabled){background:var(--warn-soft)}
  .opc:hover:not(:has(input:disabled)){border-color:var(--brand)}
  .ibtn:hover:not(:disabled){background:var(--brand-soft)}
  .pb:hover:not(:disabled){background:rgba(255,255,255,.1)}
  summary:hover{text-decoration:underline}
}
@media (max-width:959px){
  .shell{grid-template-columns:minmax(0,1fr);padding:14px 14px 80px;gap:0}
  .btn-caso{display:flex;position:sticky;top:0;z-index:20;width:100%;margin:0 0 14px;background:var(--surface);color:var(--brand);border:2px solid var(--brand);box-shadow:0 6px 14px -10px rgba(0,0,0,.5)}
  .caso{display:none;position:fixed;top:0;right:0;bottom:0;left:auto;width:min(100%,440px);max-height:none;z-index:50;border-radius:0;border:0;padding-bottom:28px}
  .caso.abierto{display:block;animation:entra .22s ease-out}
  .caso-cab{border-radius:0;position:sticky;top:0;z-index:1}
  .cerrar{display:inline-flex}
  .pb .t{display:none}
  .pb{justify-content:center;padding:6px 2px}
}
@media (max-width:520px){
  .numeral{font-size:46px}
  .fila{grid-template-columns:minmax(0,1fr)}
  .preg{padding:16px 14px}
  .nav .btn{flex:1 1 auto}
  .pista{text-align:left;flex-basis:100%;order:3}
  .intentos{margin-left:0;flex-basis:100%}
  .entrega-acc .btn{flex:1 1 100%}
  .entrega-acc .btn-w{margin-left:0}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none !important;transition:none !important;scroll-behavior:auto !important}
}
</style>
</head>
<body>
<a class="saltar" href="#principal">Ir al contenido</a>
<header class="banda" id="banda">
  <div class="banda-in">
    <p class="curso" id="curso"></p>
    <p class="marca" id="marca"></p>
    <nav aria-label="Pasos de la actividad"><ol class="barra" id="barra"></ol></nav>
  </div>
</header>
<div class="shell">
  <main id="principal" tabindex="-1">
    <button type="button" class="btn btn-caso" id="abrir-caso" aria-controls="caso" aria-expanded="false">▤ Ver los datos del caso</button>
    <p id="app-error" hidden>No se pudo cargar el contenido.</p>
    <div id="pantallas"></div>
    <div class="nav" id="nav">
      <button type="button" class="btn btn-s" data-accion="anterior">← Anterior</button>
      <p class="pista" id="pista" aria-live="polite"></p>
      <button type="button" class="btn btn-p" data-accion="siguiente">Siguiente</button>
    </div>
  </main>
  <aside class="caso" id="caso" aria-labelledby="caso-titulo"></aside>
</div>
<div class="velo" id="velo" hidden></div>

<script type="application/json" id="contenido">/*CONTENIDO*/</script>
<script>
(function(){
'use strict';
var C;
try{C=JSON.parse(document.getElementById('contenido').textContent);}catch(e){document.getElementById('app-error').hidden=false;document.getElementById('nav').hidden=true;return;}
var KEY=C.clave||'aulalista-actividad';
var PASOS=C.pasos||[];
var N=PASOS.length;
var ENT=N+1;

function h(tag,attrs){
  var e=document.createElement(tag);
  if(attrs){for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on'&&typeof v==='function')e.addEventListener(k.slice(2),v);
    else if(v===true)e.setAttribute(k,'');else e.setAttribute(k,v);}}
  for(var i=2;i<arguments.length;i++)add(e,arguments[i]);
  return e;
}
function add(e,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(function(x){add(e,x);});return;}e.append(c.nodeType?c:document.createTextNode(String(c)));}
function fmt(v){return Number.isInteger(v)?String(v):Number(v).toLocaleString('es');}
function ptsTxt(n){return n+(n===1?' punto':' puntos');}

/* Estado */
function blank(){return {paso:0,max:0,q:{},nombre:''};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&typeof o==='object'){var b=blank();for(var k in o)b[k]=o[k];if(!b.q||typeof b.q!=='object')b.q={};return b;}}}catch(e){}return blank();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
var S=load();

function def(q){switch(q.tipo){
  case 'opcion_unica':return null;
  case 'opcion_multiple':return [];
  case 'ordenar':return q.elementos.map(function(_,k){return k;}).reverse();
  case 'relacionar':return q.pares.map(function(){return '';});

  var mx=Math.max.apply(null,[0].concat(all));

  svg.appendChild(svgEl('line',{x1:ml,x2:W-mr,y1:mt+ph,y2:mt+ph,class:'eje'}));
  svg.appendChild(svgEl('line',{x1:ml,x2:ml,y1:mt,y2:mt+ph,class:'eje'}));

    if(k===0)done=S.max>0;
    b.classList.toggle('hecho',done&&!cur);
    if(cur)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current');
    b.disabled=!reachable(k);
    b.querySelector('.n').textContent=(done&&!cur)?'✓':(k===0?'⌂':k===ENT?'✎':String(k));
    b.querySelector('.t').textContent=nombrePaso(k);
    b.querySelector('.sr-only').textContent=(k>=1&&k<=N?'Paso '+k+': ':'')+nombrePaso(k)+(cur?' (actual)':done?' (completo)':b.disabled?' (no disponible)':'');
    b.title=nombrePaso(k);
  });
}
function updateNav(){
  btnAnt.hidden=S.paso===0;
  btnSig.hidden=S.paso===ENT;
  var ok=S.paso===0||stepDone(S.paso);
  btnSig.disabled=!ok;
  btnSig.textContent=S.paso===0?'Comenzar: Paso 1 →':S.paso<N?'Siguiente: Paso '+(S.paso+1)+' →':'Siguiente: Entrega →';
  pista.textContent=(!ok&&S.paso!==ENT)?'Compruebe todas las preguntas para avanzar':'';
}
function go(k,foco){
  S.paso=k;if(k>S.max)S.max=k;save();show(foco);
}
function show(foco){
  screens.forEach(function(s,k){s.hidden=k!==S.paso;});
  if(S.paso===ENT)drawEntrega();
  updateBar();updateNav();
  if(foco){try{window.scrollTo(0,0);}catch(e){}var t=screens[S.paso].querySelector('h1,h2');if(t)t.focus({preventScroll:true});}
}
btnSig.addEventListener('click',function(){if(btnSig.disabled)return;if(S.paso===0||stepDone(S.paso))go(Math.min(S.paso+1,ENT),true);});
btnAnt.addEventListener('click',function(){if(S.paso>0)go(S.paso-1,true);});

/* Entrega */
function answerText(q,st){var r=st.resp;switch(q.tipo){
  case 'opcion_unica':return r==null?'—':q.opciones[r].texto;
  case 'opcion_multiple':return r.length?r.slice().sort(function(a,b){return a-b;}).map(function(k){return q.opciones[k].texto;}).join('; '):'—';
  case 'ordenar':return r.map(function(k,p){return (p+1)+'. '+q.elementos[k].texto;}).join('  ');
  case 'relacionar':return q.pares.map(function(p,i){return p.izquierda+' → '+(r[i]===''?'—':q.pares[+r[i]].derecha);}).join('; ');
  case 'clasificar':return q.elementos.map(function(e,i){return e.texto+' → '+(r[i]||'—');}).join('; ');}return '—';}
function estadoTxt(st){return st.res==='correcta'?'Correcta':st.res==='incorrecta'?'Incorrecta':'Sin comprobar';}
function drawEntrega(){
  document.getElementById('puntaje').textContent=String(score());
  var ul=document.getElementById('resumen');ul.textContent='';
  PASOS.forEach(function(p,ii){
    var li=h('li',null,h('h3',{text:'Paso '+(ii+1)+' · '+p.titulo}));
    p.preguntas.forEach(function(q,jj){
      var id=(ii+1)+'.'+(jj+1),st=qs(id,q);var got=st.primera===true?(q.puntos||0):0;
      li.appendChild(h('div',{class:'rq'},
        h('p',{class:'q',text:id+' · '+q.enunciado}),
        h('p',{class:'a'},h('span',{class:'sr-only',text:'Su respuesta: '}),answerText(q,st)),
        h('div',{class:'meta'},
          h('span',{class:'estado '+(st.res||'')},st.res?h('span',{class:'ic','aria-hidden':'true',text:st.res==='correcta'?'✓':'✗'}):null,estadoTxt(st)),
          h('span',{text:'Intentos: '+st.intentos}),
          h('span',{text:'Puntos: '+got+' de '+(q.puntos||0)}))));
    });
    ul.appendChild(li);
  });
}
function textoEntrega(){
  var L=[];
  L.push(C.titulo+' — '+[C.curso,C.sesion].filter(Boolean).join(' · '));
  L.push('Nombre: '+(S.nombre||'').trim());
  L.push('');
  PASOS.forEach(function(p,ii){
    L.push('Paso '+(ii+1)+': '+p.titulo);
    p.preguntas.forEach(function(q,jj){
      var id=(ii+1)+'.'+(jj+1),st=qs(id,q);var got=st.primera===true?(q.puntos||0):0;
      L.push('  '+id+' '+q.enunciado);
      L.push('    Respuesta: '+answerText(q,st));
      L.push('    Resultado: '+estadoTxt(st)+' · Intentos: '+st.intentos+' · Puntos: '+got+' de '+(q.puntos||0));
    });
    L.push('');
  });
  L.push('Puntaje: '+score()+' de '+C.puntaje_total);
  L.push(C.regla_del_puntaje||'');
  L.push(C.nota_del_puntaje||'');
  return L.join('\n');
}
function copiar(){
  var t=textoEntrega(),est=document.getElementById('estado-copia'),ta=document.getElementById('manual');
  function manual(){ta.hidden=false;ta.value=t;ta.focus();ta.select();est.textContent='Copie el texto seleccionado';}
  try{
    if(navigator.clipboard&&window.isSecureContext){
      navigator.clipboard.writeText(t).then(function(){ta.hidden=true;est.textContent='✓ Entrega copiada';},manual);
    }else manual();
  }catch(e){manual();}
}
function borrar(){
  if(!window.confirm('¿Borrar todas sus respuestas?'))return;
  try{localStorage.removeItem(KEY);}catch(e){}
  S=blank();build();show(true);
}

/* Inicio */
build();
if(typeof S.paso!=='number'||S.paso<0||S.paso>ENT)S.paso=0;
if(typeof S.max!=='number'||S.max<S.paso)S.max=S.paso;
while(S.paso>0&&!reachable(S.paso))S.paso--;
show(false);
})();
</script>
