# Modelo y tope de gasto por tarea.
# tope_usd es el máximo en dólares para una sola llamada al SDK.

[conexion]
modelo = "claude-haiku-4-5-20251001"
tope_usd = 0.05

# Texto de imágenes y de páginas escaneadas. El profesor revisa el resultado.
[lectura_imagen]
modelo = "claude-sonnet-5-5"
tope_usd = 0.20
max_turns = 3

# Propuesta de las fichas desde las fuentes del curso (botón «Proponer desde las fuentes»).
[fichas]
modelo = "claude-sonnet-5-5"
tope_usd = 1.00
max_turns = 30

# Las tres preguntas de cada ejercicio antes de confirmar la ficha de la sesión (SPEC §5).
[revision_ejercicios]
modelo = "claude-sonnet-5-5"
tope_usd = 0.30
max_turns = 3

# Redacción de un material a partir de las fichas y de los pasajes de las fuentes.
[redaccion]
modelo = "claude-opus-5-5"
tope_usd = 3.00
max_turns = 40

# Corrección de un material después del verificador.
[correccion]
modelo = "claude-opus-5-5"
tope_usd = 1.50
max_turns = 20

# Primera pasada: veracidad, oración por oración, en grupos de unas 20 oraciones.
[pasada1]
modelo = "claude-sonnet-5-5"
tope_usd = 1.00
max_turns = 12
esfuerzo = "low"

# Corrección de oraciones sueltas: devuelve solo las oraciones que cambian.
[correccion_oraciones]
modelo = "claude-sonnet-5-5"
tope_usd = 0.60
max_turns = 10
esfuerzo = "medium"

# Segunda pasada: las cuatro preguntas por bloque y la lista de verificación, en una sola llamada.
[pasada2]
modelo = "claude-sonnet-5-5"
tope_usd = 0.40
max_turns = 3
esfuerzo = "high"

# Segunda pasada sobre los bloques que cambiaron después de una corrección.
[pasada2_cambios]
modelo = "claude-sonnet-5-5"
tope_usd = 0.30
max_turns = 3
esfuerzo = "medium"
