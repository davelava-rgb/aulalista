# Modelo y tope de gasto por tarea.
# tope_usd es el máximo en dólares para una sola llamada al SDK.
# cache = "1h" pide la caché de una hora para esa llamada (decisión 68 b). Sin cache, dura 5 minutos.
# cache = "no" apaga la caché en esa llamada (decisión 74 a): escribirla cuesta 1,25 veces la entrada y solo paga si otra
# llamada la lee después. La apagan las tareas de una sola llamada que nadie relee.

[conexion]
modelo = "claude-haiku-4-5-20251001"
tope_usd = 0.05
cache = "no"

# Texto de imágenes y de páginas escaneadas. El profesor revisa el resultado.
[lectura_imagen]
modelo = "claude-sonnet-5-5"
tope_usd = 0.20
max_turns = 3
cache = "no"

# Propuesta de las fichas desde las fuentes del curso (botón «Proponer desde las fuentes»).
[fichas]
modelo = "claude-sonnet-5-5"
tope_usd = 1.00
max_turns = 30

# Las tres preguntas de cada ejercicio antes de confirmar la ficha de la sesión (SPEC §5).
[revision_ejercicios]
modelo = "claude-sonnet-5-5"
tope_usd = 0.30
max_turns = 3
cache = "no"

# Botón «Corregir los ejercicios»: corrige los ejercicios que marcó la revisión anterior.
[correccion_ejercicios]
modelo = "claude-sonnet-5-5"
tope_usd = 0.40
max_turns = 3

# Redacción de un material a partir de las fichas y de los pasajes de las fuentes. Esfuerzo medio (decisión 68 e):
# Caché de una hora (decisión 74 b): la parte común de la sesión va en el mensaje de sistema, igual para los cinco
# materiales; la segunda redacción de la sesión la lee en vez de escribirla si llega dentro de la hora.
# con el esfuerzo por defecto, un cuarto de lo que costaba una redacción era razonamiento. Va sin herramientas desde
# la decisión 68 c, así que no necesita tantos turnos.
[redaccion]
modelo = "claude-opus-5-5"
tope_usd = 3.00
max_turns = 5
esfuerzo = "medium"
cache = "1h"

# Corrección de un material después del verificador: completa o por ejercicio. Solo arregla lo que señala la
# validación, así que no necesita el modelo de la redacción (decisión del profesor, 15/10/2026).
[correccion]
modelo = "claude-sonnet-5-5"
tope_usd = 1.50
max_turns = 20

# Revisión del contenido, por bloque: errores reales con su prueba (PLAN.md §0, decisión 22).
[revision]
modelo = "claude-sonnet-5-5"
tope_usd = 0.80
max_turns = 12
esfuerzo = "medium"

# Corrección de oraciones sueltas: devuelve solo las oraciones que cambian.
[correccion_oraciones]
modelo = "claude-sonnet-5-5"
tope_usd = 0.60
max_turns = 10
esfuerzo = "medium"

# Revisor independiente opcional: lo lanza el profesor con un botón. Sesión nueva, solo lectura sobre su
# carpeta (material final, fuentes y fichas). No corrige: lo que encuentra queda pendiente.
[revisor]
modelo = "claude-opus-5-5"
tope_usd = 2.00
max_turns = 30

# Botones «Completar» de la ficha del curso: sesiones, caso y datos fijos (PLAN.md §0, decisión 28).
[completar_ficha]
modelo = "claude-sonnet-5-5"
tope_usd = 0.40
max_turns = 15

# Revisión visual de las diapositivas: mira la imagen de cada una y propone cambios de diseño (decisiones 30 y 56).
# Con Opus: es la mirada de diseñador que le falta al programa (decisión 56).
[revision_visual]
modelo = "claude-opus-5-5"
tope_usd = 1.50
max_turns = 3
cache = "no"

# Corrección de las diapositivas que nombran los problemas (desborde, palabras, diseño): devuelve solo esas
# diapositivas, no el documento entero (PLAN.md §0, decisión 31).
[correccion_diapositivas]
modelo = "claude-sonnet-5-5"
tope_usd = 0.80
max_turns = 10
esfuerzo = "medium"

# Ejecución de cada prompt del laboratorio como lo haría un alumno: conversación nueva, sin herramientas
# (PLAN.md §0, decisión 35).
[ejecucion]
modelo = "claude-sonnet-5-5"
tope_usd = 0.40
max_turns = 1
cache = "no"

# Comparación de lo que salió al ejecutar un ejercicio con la respuesta correcta de la ficha (decisión 35).
[comparacion_ejecucion]
modelo = "claude-sonnet-5-5"
tope_usd = 0.30
max_turns = 1
esfuerzo = "medium"
cache = "no"

# Agente diseñador: escribe las diapositivas del programa pptxgenjs (decisión 32); el código común lo pone AulaLista
# (decisión 68 d). Esfuerzo bajo (decisión 68 e): con esfuerzo medio, todavía el 60 % de lo que escribía era
# razonamiento. Se mide en una sesión; si las fallas de diseño suben, vuelve a medio.
# Caché de una hora (decisión 68 b): el diseño dura de 5 a 7 minutos y la caché normal, de 5 minutos, expiraba
# antes del primer arreglo. Con una hora, los arreglos leen la guía y los datos en vez de escribirlos otra vez.
[diseno]
modelo = "claude-opus-5-5"
tope_usd = 4.00
max_turns = 3
esfuerzo = "low"
cache = "1h"

# Arreglos del diseñador: corrige solo las diapositivas que nombran los problemas, viendo su imagen. Va con Opus,
# como el diseño: con Sonnet, los arreglos no veían la causa de un desborde (decisión 56).
[arreglo_diseno]
modelo = "claude-opus-5-5"
tope_usd = 2.00
max_turns = 3
esfuerzo = "low"
